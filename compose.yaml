services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    volumes: [mailoop_pg:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    environment:
      MAILOOP_MIGRATION_URL: postgres://postgres:${POSTGRES_PASSWORD}@db/postgres
      MAILOOP_DB_PASSWORD: ${MAILOOP_DB_PASSWORD:?set MAILOOP_DB_PASSWORD}
      MAILOOP_PUBLIC_URL: ${MAILOOP_PUBLIC_URL:-http://127.0.0.1:8080}
    command: ["node","--import","tsx","scripts/manage.ts","migrate"]
    depends_on:
      db: {condition: service_healthy}
  web:
    build: .
    env_file: .env
    environment: &runtime
      DATABASE_URL: postgres://mailoop_service:${MAILOOP_DB_PASSWORD}@db/postgres
      MAILOOP_MASTER_KEY: ${MAILOOP_MASTER_KEY:?set MAILOOP_MASTER_KEY}
      MAILOOP_PUBLIC_URL: ${MAILOOP_PUBLIC_URL:-http://127.0.0.1:8080}
      MAILOOP_MIGRATION_URL: ""
      POSTGRES_PASSWORD: ""
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    build: .
    env_file: .env
    environment: *runtime
    command: ["node","--import","tsx","apps/service.ts","worker"]
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  mailoop_pg: {}
